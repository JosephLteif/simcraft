name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_action:
        description: 'Choose a stable bump, republish, or promote the tested dev build'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - republish
          - promote-dev
      existing_version:
        description: 'Version to republish, without the v prefix (republish only)'
        required: false
        default: ''
        type: string
      dev_version:
        description: 'Exact developer version to promote, such as 4.2.0-dev.6.1 (promote-dev only)'
        required: false
        default: ''
        type: string
      stable_version:
        description: 'Stable version to publish, without the v prefix (promote-dev only)'
        required: false
        default: ''
        type: string

jobs:
  bump-version-stable:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (
        inputs.release_action == 'patch' ||
        inputs.release_action == 'minor' ||
        inputs.release_action == 'major'
      )
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci && npm ci --prefix frontend

      - name: Bump VERSION and sync files
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(tr -d '\r\n' < VERSION)"
          echo "Current version: ${CURRENT_VERSION}"
          NEW_VERSION="$(npm version "${{ github.event.inputs.release_action }}" --no-git-tag-version | sed 's/^v//')"
          echo "${NEW_VERSION}" > VERSION
          npm run sync:version
          npm install --package-lock-only
          npm install --package-lock-only --prefix frontend
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Promote Unreleased changelog
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/promote-changelog.js \
            --version "${NEW_VERSION}" \
            --date "$(date -u +%F)"
          npm run sync:changelog

      - name: Validate synchronized release version
        run: npm run verify:release -- "${{ steps.bump.outputs.new_version }}"

      - name: Validate synchronized changelog
        run: npm run check:changelog

      - name: Commit and tag release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json frontend/package.json Cargo.toml backend/Cargo.toml desktop/src-tauri/tauri.conf.json desktop/src-tauri/tauri.docker.conf.json package-lock.json frontend/package-lock.json Cargo.lock backend/Cargo.lock CHANGELOG.md docs/whats-new-history.md frontend/src/app/lib/changelog.generated.json
          if git diff --cached --quiet; then
            echo "No version changes detected; refusing to publish without a release tag."
            exit 1
          fi
          git commit -m "chore(release): bump version to v${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          # Keep the release token for the master push so Pages still receives its push event.
          # Push the tag with GITHUB_TOKEN so the tag cannot recursively start Release again.
          git push origin master
          AUTH_HEADER="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "v${{ steps.bump.outputs.new_version }}"
          echo "release_tag=v${{ steps.bump.outputs.new_version }}" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  promote-dev:
    if: github.event_name == 'workflow_dispatch' && inputs.release_action == 'promote-dev'
    outputs:
      release_tag: ${{ steps.promote.outputs.release_tag }}
      release_sha: ${{ steps.promote.outputs.release_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false

      - name: Select tested dev build
        id: select
        shell: bash
        env:
          DEV_VERSION: ${{ inputs.dev_version }}
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          if [[ ! "${DEV_VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-dev\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote-dev requires an exact developer version such as 4.2.0-dev.6.1"
            exit 1
          fi
          if [[ ! "${STABLE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote-dev requires a stable version such as 6.0.0"
            exit 1
          fi
          VERSION="${STABLE_VERSION}"
          DEV_TAG="dev-build/${DEV_VERSION}"
          if ! git ls-remote --exit-code origin "refs/tags/${DEV_TAG}" >/dev/null; then
            echo "Developer source tag ${DEV_TAG} does not exist; run a new Dev Release after the immutable-tag workflow is deployed."
            exit 1
          fi
          git fetch origin "refs/tags/${DEV_TAG}:refs/tags/${DEV_TAG}"
          git checkout --detach "refs/tags/${DEV_TAG}"
          DEV_SHA="$(git rev-parse HEAD)"
          echo "stable_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dev_sha=${DEV_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create stable tag from tested dev build
        id: promote
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DEV_VERSION: ${{ inputs.dev_version }}
          DEV_SHA: ${{ steps.select.outputs.dev_sha }}
          STABLE_VERSION: ${{ steps.select.outputs.stable_version }}
        run: |
          set -euo pipefail
          VERSION="${STABLE_VERSION}"
          if git ls-remote --exit-code origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "Stable release tag v${VERSION} already exists; select a different developer version."
            exit 1
          fi

          git fetch origin master
          git checkout --detach origin/master
          SOURCE_PATCH="${RUNNER_TEMP}/dev-source.patch"
          git diff --binary --no-renames origin/master "${DEV_SHA}" -- . ':(exclude).github/workflows/**' > "${SOURCE_PATCH}"
          if [[ -s "${SOURCE_PATCH}" ]]; then
            git apply "${SOURCE_PATCH}"
          fi

          printf '%s\n' "${VERSION}" > VERSION
          npm run sync:version
          npm install --package-lock-only --ignore-scripts
          npm install --prefix frontend --package-lock-only --ignore-scripts
          node scripts/promote-changelog.js \
            --version "${VERSION}" \
            --date "$(date -u +%F)"
          npm run sync:changelog
          npm run check:changelog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json frontend/package.json Cargo.toml backend/Cargo.toml desktop/src-tauri/tauri.conf.json desktop/src-tauri/tauri.docker.conf.json package-lock.json frontend/package-lock.json Cargo.lock backend/Cargo.lock CHANGELOG.md docs/whats-new-history.md frontend/src/app/lib/changelog.generated.json
          git commit -m "chore(release): promote ${DEV_VERSION} to v${VERSION}"

          npm run verify:release -- "${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git tag "v${VERSION}"
          AUTH_HEADER="$(printf 'x-access-token:%s' "${RELEASE_TOKEN}" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/master"
          AUTH_HEADER="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

  validate_republish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_action == 'republish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate existing release tag
        shell: bash
        env:
          EXISTING_VERSION: ${{ inputs.existing_version }}
        run: |
          set -euo pipefail
          if [[ ! "${EXISTING_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Republish requires an existing semantic version such as 4.0.0"
            exit 1
          fi
          if ! git ls-remote --exit-code origin "refs/tags/v${EXISTING_VERSION}" >/dev/null; then
            echo "Release tag v${EXISTING_VERSION} does not exist"
            exit 1
          fi

  publish:
    if: >-
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.release_action != 'republish' && inputs.release_action != 'promote-dev' && needs.bump-version-stable.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_action == 'republish' && needs.validate_republish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_action == 'promote-dev' && needs.promote-dev.result == 'success')
      )
    needs: [bump-version-stable, promote-dev, validate_republish]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows'
            os: 'windows-latest'
            args: '--config src-tauri/tauri.conf.json --bundles nsis'

    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_action == 'promote-dev' && needs.promote-dev.outputs.release_tag || github.event_name == 'workflow_dispatch' && inputs.release_action != 'republish' && inputs.release_action != 'promote-dev' && needs.bump-version-stable.outputs.release_tag || github.event_name == 'workflow_dispatch' && inputs.release_action == 'republish' && format('v{0}', inputs.existing_version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95

      - name: install dependencies
        run: npm ci && npm ci --prefix frontend

      - name: Validate release version from tag
        shell: bash
        run: npm run verify:release -- "${RELEASE_TAG#v}"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target

      - name: Cache Next build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-release-${{ hashFiles('frontend/package-lock.json', 'frontend/tsconfig.json', 'frontend/tailwind.config.ts', 'frontend/next.config.js', 'frontend/next.config.mjs', 'frontend/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-release-

      - name: Ensure bundled resource paths exist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/resources/data
          if [[ ! -f backend/resources/zones-encounters-index.json ]]; then
            echo "backend/resources/zones-encounters-index.json is required for release bundles"
            exit 1
          fi
          for file in wow-expansions.json wow-instances.json wow-encounters.json wow-seasons.json; do
            if [[ ! -f "backend/resources/wow/$file" ]]; then
              echo "backend/resources/wow/$file is required for release bundles"
              exit 1
            fi
          done
          cp backend/resources/zones-encounters-index.json backend/resources/data/zones-encounters-index.json
          touch backend/resources/data/.keep

      - name: Build and release desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DESKTOP_BUILD: true
          NEXT_PUBLIC_DESKTOP_BUILD: true
        with:
          projectPath: desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'WhyLowDps ${{ env.RELEASE_TAG }}'
          releaseBody: 'Release assets uploaded. Checksums will be added automatically.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload zones encounters index asset
        if: matrix.platform == 'windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" backend/resources/zones-encounters-index.json --clobber

  publish-container:
    if: >-
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.release_action != 'republish' && inputs.release_action != 'promote-dev' && needs.bump-version-stable.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_action == 'republish' && needs.validate_republish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_action == 'promote-dev' && needs.promote-dev.result == 'success')
      )
    needs: [bump-version-stable, promote-dev, validate_republish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.digest.outputs.image_digest }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_action == 'promote-dev' && needs.promote-dev.outputs.release_tag || github.event_name == 'workflow_dispatch' && inputs.release_action != 'republish' && inputs.release_action != 'promote-dev' && needs.bump-version-stable.outputs.release_tag || github.event_name == 'workflow_dispatch' && inputs.release_action == 'republish' && format('v{0}', inputs.existing_version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/josephlteif/whylowdps
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Ensure container resource paths exist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/resources/data
          if [[ ! -f backend/resources/zones-encounters-index.json ]]; then
            echo "backend/resources/zones-encounters-index.json is required for container releases"
            exit 1
          fi
          cp backend/resources/zones-encounters-index.json backend/resources/data/zones-encounters-index.json
          touch backend/resources/data/.keep

      - name: Build private-hosting image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WHYLOWDPS_DEPLOYMENT=hosted-private
            WHYLOWDPS_VERSION=${{ steps.meta.outputs.version }}
            WHYLOWDPS_REVISION=${{ github.event_name == 'workflow_dispatch' && inputs.release_action == 'promote-dev' && needs.promote-dev.outputs.release_sha || github.event_name == 'workflow_dispatch' && inputs.release_action != 'republish' && inputs.release_action != 'promote-dev' && needs.bump-version-stable.outputs.release_sha || github.sha }}

      - name: Smoke test container
        shell: bash
        env:
          IMAGE: ghcr.io/josephlteif/whylowdps:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          CONTAINER="whylowdps-release-smoke"
          cleanup() {
            docker logs "${CONTAINER}" 2>&1 || true
            docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${CONTAINER}" \
            --publish 127.0.0.1:18000:8000 \
            --env ALLOW_EXTERNAL_BIND=true \
            --env JWT_SECRET=release-smoke-secret-012345678901234567890123 \
            --env WHYLOWDPS_SECURE_COOKIES=false \
            "${IMAGE}"

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              break
            fi
            sleep 2
          done

          if ! curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
            echo "Container did not become healthy"
            exit 1
          fi

          docker exec "${CONTAINER}" sh -lc \
            'test -x /data/simc-runtime/simc && /data/simc-runtime/simc display_build=2'

      - name: Push release image tags
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r IMAGE; do
            [[ -z "${IMAGE}" ]] || docker push "${IMAGE}"
          done <<< "${IMAGE_TAGS}"

      - name: Record published image digest
        id: digest
        shell: bash
        env:
          IMAGE: ghcr.io/josephlteif/whylowdps:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}" | awk '/Digest:/ {print $2; exit}')"
          if [[ -z "${DIGEST}" ]]; then
            echo "Unable to determine published image digest"
            exit 1
          fi
          echo "image_digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

  finalize-release:
    if: >-
      always() &&
      (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_action != 'republish' && inputs.release_action != 'promote-dev' && needs.bump-version-stable.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_action == 'republish' && needs.validate_republish.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_action == 'promote-dev' && needs.promote-dev.result == 'success')
      )
    needs: [publish, publish-container, bump-version-stable, promote-dev, validate_republish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_action == 'promote-dev' && needs.promote-dev.outputs.release_tag || github.event_name == 'workflow_dispatch' && inputs.release_action != 'republish' && inputs.release_action != 'promote-dev' && needs.bump-version-stable.outputs.release_tag || github.event_name == 'workflow_dispatch' && inputs.release_action == 'republish' && format('v{0}', inputs.existing_version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Upload private-hosting release bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.publish-container.outputs.image_digest }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          BUNDLE_DIR="$(mktemp -d)"
          cp compose.yaml "${BUNDLE_DIR}/compose.yaml"
          cp .env.docker.example "${BUNDLE_DIR}/.env.docker.example"
          cp docs/docker-hosting.md "${BUNDLE_DIR}/docker-hosting.md"
          printf 'ghcr.io/josephlteif/whylowdps:latest\n' > "${BUNDLE_DIR}/docker-image.txt"
          printf 'ghcr.io/josephlteif/whylowdps:%s\n' "${VERSION}" >> "${BUNDLE_DIR}/docker-image.txt"
          printf 'ghcr.io/josephlteif/whylowdps@%s\n' "${IMAGE_DIGEST}" >> "${BUNDLE_DIR}/docker-image.txt"
          gh release upload "${TAG}" \
            "${BUNDLE_DIR}/compose.yaml" \
            "${BUNDLE_DIR}/.env.docker.example" \
            "${BUNDLE_DIR}/docker-hosting.md" \
            "${BUNDLE_DIR}/docker-image.txt" \
            --clobber

      - name: Generate release checksums and notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          TMP_DIR="$(mktemp -d)"
          NOTES_FILE="${TMP_DIR}/release-notes.md"
          CHECKSUM_FILE="${TMP_DIR}/checksums.txt"
          ASSET_LIST_FILE="${TMP_DIR}/assets.txt"

          gh release download "${TAG}" --dir "${TMP_DIR}"

          mapfile -t ASSET_FILES < <(find "${TMP_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#ASSET_FILES[@]}" -eq 0 ]]; then
            echo "No release assets found for ${TAG}"
            exit 1
          fi

          : > "${CHECKSUM_FILE}"
          : > "${ASSET_LIST_FILE}"
          for FILE in "${ASSET_FILES[@]}"; do
            HASH="$(sha256sum "${TMP_DIR}/${FILE}" | awk '{print $1}')"
            printf '%s  %s\n' "${FILE}" "${HASH}" >> "${CHECKSUM_FILE}"
            printf '%s\n' "${FILE}" >> "${ASSET_LIST_FILE}"
          done

          node scripts/release-notes.js \
            --version "${VERSION}" \
            --assets-file "${ASSET_LIST_FILE}" \
            --checksums-file "${CHECKSUM_FILE}" \
            --output "${NOTES_FILE}"

          gh release edit "${TAG}" --notes-file "${NOTES_FILE}"

      - name: Publish completed release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${RELEASE_TAG}" --draft=false

      - name: Notify Discord release channel
        shell: bash
        env:
          CHANNEL: stable
          TAG: ${{ env.RELEASE_TAG }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
          STABLE_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_STABLE }}
        run: |
          set -euo pipefail
          node scripts/notify-discord-release.js
